name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SakhiNidhi Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web App & Sync Capacitor
        run: npm run cap:sync

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Direct APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SakhiNidhi.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SakhiNidhi-APK
          path: SakhiNidhi.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases (No Zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "SakhiNidhi Android App (Latest Direct APK)"
          body: "Direct installable APK for Android. Download SakhiNidhi.apk directly to your phone without extracting any zip."
          files: SakhiNidhi.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
